<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAVAGOTCHI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --white: #f5f5f0;
    --gray: #aaa;
    --pixel: 'Press Start 2P', monospace;
  }

  html, body {
    min-height: 100%;
    background: var(--white);
    color: var(--black);
    font-family: var(--pixel);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  .shell {
    width: 660px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── header ── */
  .hdr {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--black);
    padding-bottom: 10px;
    margin-bottom: 18px;
  }
  .hdr-title { font-size: 13px; letter-spacing: 3px; }
  .hdr-ver   { font-size: 7px; color: var(--gray); }

  /* ── screen ── */
  .screen {
    width: 640px;
    height: 480px;
    border: 3px solid var(--black);
    position: relative;
    overflow: hidden;
    background: var(--white);
  }

  /* pixel grid */
  .screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
    background-size: 4px 4px;
    pointer-events: none;
    z-index: 10;
  }

  /* ── ground ── */
  .ground {
    position: absolute;
    bottom: 64px;
    left: 0; right: 0;
    height: 2px;
    background: var(--black);
    z-index: 2;
  }

  /* ── walking canvas ── */
  #spriteCanvas {
    position: absolute;
    bottom: 96px;
    left: 0;
    image-rendering: pixelated;
    z-index: 5;
    width: 64px;
    height: 64px;
  }

  /* ── HP bar ── */
  .hp-bar-wrap {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 8px;
    z-index: 6;
  }
  .hp-label { min-width: 20px; }
  .hp-track {
    flex: 1;
    height: 8px;
    border: 2px solid var(--black);
  }
  .hp-fill {
    height: 100%;
    background: var(--black);
    transition: width 0.5s;
  }
  .hp-val { min-width: 32px; text-align: right; }

  /* ── status bar ── */
  .status-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    border-top: 2px solid var(--black);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 9px;
    z-index: 6;
    background: var(--white);
  }

  /* ── action hint ── */
  .action-hint {
    position: absolute;
    bottom: 80px;
    left: 0; right: 0;
    text-align: center;
    font-size: 8px;
    color: var(--black);
    z-index: 6;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    letter-spacing: 1px;
  }
  .action-hint.show { opacity: 1; }
  .action-hint.blink { animation: hintBlink 0.5s step-end 4; }
  @keyframes hintBlink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── overlays ── */
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 20;
    text-align: center;
    padding: 32px;
  }
  .overlay.show { display: flex; }

  .overlay-intro { background: var(--white); }
  .overlay-intro .ov-title { font-size: 16px; }
  .overlay-intro .ov-sub   { font-size: 9px; line-height: 2.2; color: var(--gray); }

  .overlay-dead { background: var(--black); color: var(--white); }
  .overlay-dead .rip    { font-size: 20px; }
  .overlay-dead .ov-sub { font-size: 9px; line-height: 2.2; color: var(--gray); }

  /* ── ticker ── */
  .ticker {
    width: 640px;
    height: 26px;
    border-left: 3px solid var(--black);
    border-right: 3px solid var(--black);
    border-bottom: 3px solid var(--black);
    background: var(--black);
    color: var(--white);
    font-size: 7px;
    display: grid;
    align-items: center;
    padding: 0 12px;
    overflow: hidden;
    justify-content: center;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .ticker-text { white-space: nowrap; display: inline-flex; justify-content: center; width: 205px; }
  .ticker-text.scroll { animation: tickerScroll 7s linear forwards; }
  @keyframes tickerScroll { 0%{transform:translateX(0)} 100%{transform:translateX(-55%)} }

  /* ── controls ── */
  .controls {
    margin-top: 18px;
    width: 640px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  .btn {
    font-family: var(--pixel);
    background: var(--white);
    border: 2px solid var(--black);
    height: 52px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.05s, transform 0.05s;
    user-select: none;
    position: relative;
  }
  /* circle dot indicator */
  .btn::after {
    content: '';
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--black);
    display: block;
    transition: background 0.05s, border-color 0.05s;
  }
  .btn:hover:not(:disabled)         { background: var(--black); }
  .btn:hover:not(:disabled)::after  { border-color: var(--white); }
  .btn:active:not(:disabled)        { transform: scale(0.96); }
  .btn:disabled {
    border-color: var(--gray);
    cursor: not-allowed;
  }
  .btn:disabled::after { border-color: var(--gray); }

  /* ── footer ── */
  .footer {
    margin-top: 14px;
    width: 640px;
    border-top: 2px solid var(--black);
    padding-top: 8px;
    display: flex;
    justify-content: space-between;
    font-size: 6px;
    color: var(--gray);
  }

  .cursor::after {
    content: '_';
    animation: cursorBlink 0.8s step-end infinite;
  }
  @keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>
</head>
<body>
<div class="shell">

  <div class="hdr">
    <span class="hdr-title">JAVAGOTCHI</span>
    <span class="hdr-ver">v0.0.1</span>
  </div>

  <div class="screen" id="screen">

    <div class="hp-bar-wrap">
      <span class="hp-label">HP</span>
      <div class="hp-track"><div class="hp-fill" id="hpFill" style="width:0%"></div></div>
      <span class="hp-val" id="hpVal">---</span>
    </div>

    <canvas id="spriteCanvas" width="64" height="64"></canvas>

    <div class="ground"></div>

    <div class="action-hint" id="actionHint"></div>

    <div class="status-bar">
      <span id="statName">--------</span>
      <span id="statAge">AGE ---</span>
    </div>

    <!-- intro overlay -->
    <div class="overlay overlay-intro show" id="introOverlay">
      <div class="ov-title">NO CREATURE</div>
      <div class="ov-sub">press LEFT BUTTON<br>to create one</div>
    </div>

    <!-- dead overlay -->
    <div class="overlay overlay-dead" id="deadOverlay">
      <div class="rip">R.I.P.</div>
      <div id="deadName" style="font-size:10px"></div>
      <div class="ov-sub">press LEFT BUTTON<br>for new life</div>
    </div>

  </div>

  <div class="ticker">
    <span class="ticker-text" id="tickerLeft">Pet</span>
    <span class="ticker-text" id="tickerCenter">Feed</span>
    <span class="ticker-text" id="tickerRight">Play</span>
  </div>

  <div class="controls">
    <button class="btn" id="btnLeft"></button>
    <button class="btn" id="btnCenter" disabled></button>
    <button class="btn" id="btnRight"  disabled></button>
  </div>

  <div class="footer">
    <span id="footerLeft">READY</span>
    <span id="footerRight" class="cursor"></span>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════════
// PIXEL SPRITES  8×8 grid drawn on canvas (PX = scale factor)
// '#' = black  'g' = gray  '.' = transparent
// ══════════════════════════════════════════════════════════════════
const PX = 6; // 1 game-pixel = 6 css-px  →  8*6=48 inside 64px canvas

const FRAMES = {
  walkA: [
    '..###...',
    '.#####..',
    '.#o.o#..',
    '.#####..',
    '..###...',
    '.#####..',
    '.##.##..',
    '.#...#..'
  ],
  walkB: [
    '..###...',
    '.#####..',
    '.#o.o#..',
    '.#####..',
    '..###...',
    '.#####..',
    '..###...',
    '.#.#.#..'
  ],
  happy: [
    '.#.###.#',
    '..#####.',
    '..#^.^#.',
    '..#####.',
    '...###..',
    '..#####.',
    '..#.#.#.',
    '..#.#.#.'
  ],
  hungry: [
    '..###...',
    '.#####..',
    '.#O.O#..',
    '.##.##..',
    '..#.#...',
    '.#####..',
    '.##.##..',
    '.#...#..'
  ],
  sick: [
    '..###...',
    '.#####..',
    '.#X.X#..',
    '.#####..',
    '..###...',
    '.#####..',
    '.##.##..',
    '.#...#..'
  ],
  dead: [
    '........',
    '..###...',
    '.#####..',
    '.#X.X#..',
    '.##.##..',
    '..###...',
    '........',
    '........'
  ],
  empty: [
    '...#....',
    '..###...',
    '...#....',
    '..###...',
    '.#####..',
    '..###...',
    '...#....',
    '........'
  ]
};

const canvas = document.getElementById('spriteCanvas');
const ctx    = canvas.getContext('2d');

function drawSprite(key) {
  const frame = FRAMES[key] || FRAMES.empty;
  ctx.clearRect(0, 0, 64, 64);
  const OFF = 8; // center 48px in 64px canvas
  for (let r = 0; r < 8; r++) {
    const line = (frame[r] || '........');
    for (let c = 0; c < 8; c++) {
      const ch = line[c];
      if      (ch === '#') ctx.fillStyle = '#0a0a0a';
      else if (ch === 'g') ctx.fillStyle = '#888888';
      else continue;
      ctx.fillRect(OFF + c * PX, OFF + r * PX, PX, PX);
    }
  }
}

// ══════════════════════════════════════════════════════════════════
// WALKING ENGINE
// ══════════════════════════════════════════════════════════════════
const SCREEN_W    = 640;
const SCREEN_H    = 480;
const SPRITE_W    = 64;
const SPRITE_H    = 64;
const WALK_STEP   = 2;
const WALK_MS     = 55;
const FRAME_MS    = 220;

let walkX    = 100;
let walkY    = 96;
let xDir  = 1; // 1=right -1=left
let yDir  = 1; // 1=up -1=down
let wFrame   = 'walkA';
let wMood    = 'walkA';  // base mood for normal walk
let walkTmr  = null;
let frameTmr = null;

function posCanvas(x, y, xDir, yDir) {
  canvas.style.left      = x + 'px'; 
  canvas.style.bottom    = y + 'px';
  canvas.style.transform = xDir < 0 ? 'scaleX(-1)' : 'scaleX(1)';
}

function startWalk(mood) {
  wMood = mood;
  stopWalk();
  drawSprite(mood === 'happy' ? 'happy' : 'walkA');
  posCanvas(walkX, walkY, xDir, yDir);

  frameTmr = setInterval(() => {
    wFrame = wFrame === 'walkA' ? 'walkB' : 'walkA';
    drawSprite(mood === 'happy' ? 'happy' : wFrame);
  }, FRAME_MS);

  walkTmr = setInterval(() => {
    const speed = mood === 'happy' ? WALK_STEP * 1.5 : WALK_STEP;
    walkX += speed * xDir;
    walkY += speed * yDir;
    if (walkX > SCREEN_W - SPRITE_W - 20) xDir = -1;
    if (walkX < 20) xDir =  1;

    if (walkY < 96) yDir = 1;
    if (walkY > SCREEN_H - SPRITE_H - 20) yDir = -1;
    posCanvas(walkX, walkY, xDir, yDir);
  }, WALK_MS);
}

function stopWalk() {
  clearInterval(walkTmr);
  clearInterval(frameTmr);
  walkTmr = frameTmr = null;
}

function showStatic(key) {
  stopWalk();
  drawSprite(key);
  posCanvas(walkX, walkY, 1, 1);
}

// ══════════════════════════════════════════════════════════════════
// HP BAR
// ══════════════════════════════════════════════════════════════════
const HP_MAX = 200;
function renderHp(hp) {
  const pct = Math.min(100, Math.max(0, Math.round((hp / HP_MAX) * 100)));
  document.getElementById('hpFill').style.width = pct + '%';
  document.getElementById('hpVal').textContent  = String(hp).padStart(3, ' ');
}

// ══════════════════════════════════════════════════════════════════
// AGE
// ══════════════════════════════════════════════════════════════════
let localAge = 0;
let ageTimer = null;
function fmtAge(s) {
  if (s < 60)   return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm' + (s % 60) + 's';
  return Math.floor(s / 3600) + 'h' + Math.floor((s % 3600) / 60) + 'm';
}
function startAgeTimer(init) {
  clearInterval(ageTimer);
  localAge = init;
  document.getElementById('statAge').textContent = 'AGE ' + fmtAge(localAge);
  ageTimer = setInterval(() => {
    localAge++;
    document.getElementById('statAge').textContent = 'AGE ' + fmtAge(localAge);
  }, 1000);
}

// ══════════════════════════════════════════════════════════════════
// FOOTER
// ══════════════════════════════════════════════════════════════════
function setFooter(l, r) {
  document.getElementById('footerLeft').textContent  = l || '';
  document.getElementById('footerRight').textContent = r || '';
}

// ══════════════════════════════════════════════════════════════════
// ACTION HINT (on-screen message)
// ══════════════════════════════════════════════════════════════════
let hintTmr = null;
function showHint(msg, persist) {
  clearTimeout(hintTmr);
  const el = document.getElementById('actionHint');
  el.textContent = msg;
  el.classList.remove('blink', 'show');
  void el.offsetWidth;
  el.classList.add('show', 'blink');
  if (!persist) hintTmr = setTimeout(() => el.classList.remove('show'), 2500);
}
function hideHint() {
  clearTimeout(hintTmr);
  document.getElementById('actionHint').classList.remove('show');
}

// ══════════════════════════════════════════════════════════════════
// OVERLAYS
// ══════════════════════════════════════════════════════════════════
function showIntro() {
  document.getElementById('introOverlay').classList.add('show');
  document.getElementById('deadOverlay').classList.remove('show');
}
function showDeadScreen(name) {
  document.getElementById('introOverlay').classList.remove('show');
  document.getElementById('deadOverlay').classList.add('show');
  document.getElementById('deadName').textContent =
    (name || 'CREATURE').toUpperCase() + ' IS GONE';
}
function hideOverlays() {
  document.getElementById('introOverlay').classList.remove('show');
  document.getElementById('deadOverlay').classList.remove('show');
}

// ══════════════════════════════════════════════════════════════════
// BUTTON MODE
// mode: 'empty' | 'alive' | 'dead'
// ══════════════════════════════════════════════════════════════════
const btnLeft   = document.getElementById('btnLeft');
const btnCenter = document.getElementById('btnCenter');
const btnRight  = document.getElementById('btnRight');

function setMode(m) {
  if (m === 'alive') {
    btnLeft.disabled   = false;
    btnCenter.disabled = false;
    btnRight.disabled  = false;
    btnLeft.onclick    = onPlay;
    btnCenter.onclick  = onFeed;
    btnRight.onclick   = onPlay;
  } else {
    // empty or dead: only left = start
    btnLeft.disabled   = false;
    btnCenter.disabled = true;
    btnRight.disabled  = true;
    btnLeft.onclick    = onStart;
    btnCenter.onclick  = null;
    btnRight.onclick   = null;
  }
}

// ══════════════════════════════════════════════════════════════════
// MOOD
// ══════════════════════════════════════════════════════════════════
function moodKey(data) {
  if (!data || !data.alive) return 'dead';
  if (data.health <= 20)    return 'sick';
  if (data.hungry)          return 'hungry';
  if (data.health >= 80)    return 'happy';
  return 'walkA';
}

// ══════════════════════════════════════════════════════════════════
// APPLY API DATA
// ══════════════════════════════════════════════════════════════════
let creature = null;
let pollTmr  = null;

function applyData(data) {
  creature = data;

  if (!data.alive) {
    clearInterval(ageTimer);
    clearInterval(pollTmr);
    stopWalk();
    showStatic('dead');
    renderHp(0);
    showDeadScreen(data.name);
    setMode('dead');
    setFooter('DECEASED', '');
    hideHint();
    return;
  }

  hideOverlays();
  renderHp(data.health);
  document.getElementById('statName').textContent =
    (data.name || '--------').substring(0, 8).toUpperCase();
  startAgeTimer(data.age);
  setMode('alive');

  const mood = moodKey(data);

  // hungry / sick → stop and show warning sprite
  if (mood === 'sick' || mood === 'hungry') {
    startWalk(mood === 'sick' ? 'walkA' : 'walkA');
    drawSprite(mood);  // override with warning face
    if (data.hungry) {
      showHint('>> HUNGRY! <<', true);
      setFooter('HUNGRY', '');
    } else {
      showHint('>> SICK... <<', true);
      setFooter('SICK', '');
    }
  } else {
    startWalk(mood);
    hideHint();
    setFooter(mood === 'happy' ? 'HAPPY' : 'OK', '');
  }
}

// ══════════════════════════════════════════════════════════════════
// API
// ══════════════════════════════════════════════════════════════════
async function api(method) {
  const resp = await fetch('/javagotchi', {
    method,
    headers: { Accept: 'application/json' }
  });
  if (!resp.ok) {
    const body = await resp.json().catch(() => ({}));
    throw { status: resp.status, message: body.message || resp.statusText };
  }
  return resp.json();
}

async function doVisit() {
  try {
    const data = await api('GET');
    applyData(data);

  } catch (e) {
    if (e.status === 404) {
      showIntro(); showStatic('empty'); setMode('empty');
      clearInterval(pollTmr);
      setFooter('NO CREATURE', '');
    } else if (e.status === 410) {
      showDeadScreen(creature ? creature.name : '');
      showStatic('dead'); setMode('dead');
      clearInterval(pollTmr); stopWalk();
      setFooter('DECEASED', '');
    } else {
      setFooter('ERR ' + e.status, '');
    }

  }
}

// ══════════════════════════════════════════════════════════════════
// BUTTON HANDLERS
// ══════════════════════════════════════════════════════════════════

// LEFT / RIGHT when alive → play burst animation
function onPlay() {
  if (!creature || !creature.alive) return;
  if (creature.hungry) {
    showHint('>> HUNGRY! <<');
    setFooter('HUNGRY', '');
    return;
  }
  if (creature.health <= 64) {
    showHint('>> TOO WEAK... <<');
    setFooter('WEAK', '');
    return;
  }  
  showHint('>> YAY! <<');
  stopWalk();
  let t = 0;
  const burst = setInterval(() => {
    t++;
    walkX += WALK_STEP * 3 * xDir;
    if (walkX > SCREEN_W - SPRITE_W - 20) xDir = -1;
    if (walkX < 20)                        xDir =  1;
    posCanvas(walkX, walkY, xDir, yDir);
    drawSprite(t % 2 === 0 ? 'happy' : 'walkB');
    if (t >= 22) {
      clearInterval(burst);
      startWalk(moodKey(creature));
    }
  }, WALK_MS);
}

// LEFT when empty/dead → create
async function onStart() {
  setFooter('CREATING...', '');
  hideOverlays();
  showStatic('empty');
  try {
    const data = await api('POST');
    applyData(data);
    showHint('>> WELCOME ' + (data.name || '').toUpperCase() + '! <<');

    startPoll();
  } catch (e) {
    if (e.status === 400) {
      await doVisit();
      startPoll();
    } else {
      showIntro(); setMode('empty');

      setFooter('ERROR' + e.message, '');
    }
  }
}

// CENTER when alive → feed
async function onFeed() {
  setFooter('FEEDING...', '');
  showHint('>> NOM NOM... <<');
  try {
    const data = await api('PUT');
    applyData(data);
    showHint('>> YUM YUM! <<');
  } catch (e) {
    if (e.status === 404) {
      showIntro(); setMode('empty'); stopWalk(); setFooter('NO CREATURE', '');
    } else if (e.status === 410) {
      showDeadScreen(creature ? creature.name : '');
      setMode('dead'); stopWalk(); setFooter('DECEASED', '');
    } else {
      showHint('>> NOPE! <<');
      setFooter('SATED', '');
    }

  }
}

// ══════════════════════════════════════════════════════════════════
// POLL
// ══════════════════════════════════════════════════════════════════
function startPoll() {
  clearInterval(pollTmr);
  pollTmr = setInterval(doVisit, 30000);
}

// ══════════════════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════════════════
(async () => {
  drawSprite('empty');
  posCanvas(walkX, 1);
  showIntro();
  setMode('empty');
  setFooter('CONNECTING...', '');
  try {
    const data = await api('GET');
    applyData(data);
    startPoll();
  } catch (e) {
    if (e.status === 410) {
      showDeadScreen('');
      showStatic('dead');
      setMode('dead');

    } else {
      showIntro();
      showStatic('empty');
      setMode('empty');

    }
    setFooter('READY', '');
  }
})();
